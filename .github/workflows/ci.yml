name: Web checks

on:
  push:
    branches: [main, develop, 'ui/**', 'feature/**', 'feat/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --maxWorkers=2
      - run: pnpm build
      - run: pnpm build:preview
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser and visual regression
        run: pnpm test:e2e
      - name: Run Gateway-mode browser contracts (mocked HTTP)
        run: pnpm test:e2e:gateway
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload visual diffs and browser artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-test-results-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  built-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [fixture, gateway]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build and test isolated bundle (fixture or HTTP mock, not live Backend)
        run: node scripts/e2e-built.mjs ${{ matrix.mode }}
      - name: Upload built browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-built-${{ matrix.mode }}-${{ github.run_attempt }}
          path: |
            test-results/${{ matrix.mode }}-preview/
            playwright-report/${{ matrix.mode }}-preview/
          if-no-files-found: ignore
          retention-days: 14
